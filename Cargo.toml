[workspace]
members = ["examples/demo", "examples/flip_demo"]

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2" }

[package]
name = "gpui-motion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "State-driven spring and tween animations for gpui, with velocity-preserving retargeting"
repository = "https://github.com/AprilNEA/gpui-motion"
authors = ["AprilNEA <dev@aprilnea.me>"]
readme = "README.md"
keywords = ["gpui", "animation", "motion"]
categories = ["gui"]

[dependencies]
gpui = { version = "0.2.2", optional = true }

[features]
default = ["gpui"]
gpui = ["dep:gpui"]
gpui-main = ["gpui"]

[package]
name = "gpui-motion"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "State-driven spring and tween animations for gpui, with velocity-preserving retargeting"
repository = "https://github.com/aprilnea/gpui-motion"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", optional = true }

[features]
default = ["gpui"]
gpui = ["dep:gpui"]
